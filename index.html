<!DOCTYPE html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colloqui scuola-famiglia – IIS Ciusa</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blu-900:#0f2a47; --blu-700:#1F4E79; --blu-500:#2f6fae; --blu-100:#e7f0fa; --blu-50:#f3f7fc;
    --testo:#18212b; --grigio:#5d6875; --grigio-chiaro:#8a95a3; --bordo:#e2e8f0; --sfondo:#f4f6fa;
    --terra:#0f7b5f; --terra-bg:#e3f5ee;
    --p1:#2f6fae;   --p1-bg:#e5eefa;
    --p2:#7a3fb0;   --p2-bg:#f1e8fa;
    --bib:#b26a00;  --bib-bg:#fdf1dc;
    --raggio:14px; --ombra:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--testo);background:var(--sfondo);line-height:1.5;-webkit-font-smoothing:antialiased}

  /* ---------- Intestazione ---------- */
  header{
    position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(135deg,var(--blu-900) 0%,var(--blu-700) 55%,var(--blu-500) 100%);
    padding:34px 20px 74px;
  }
  header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
  header::before{width:340px;height:340px;right:-90px;top:-150px}
  header::after{width:220px;height:220px;right:140px;bottom:-140px}
  .wrap{max-width:960px;margin:0 auto;position:relative}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  .eyebrow::before{content:"";width:22px;height:2px;background:#f2b705;border-radius:2px}
  h1{margin:8px 0 4px;font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
  .sottotitolo{margin:0;opacity:.9;font-size:1rem}
  .pillole{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .pillola{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
           padding:7px 13px;border-radius:999px;font-size:.9rem;font-weight:500;backdrop-filter:blur(4px)}
  .pillola svg{width:16px;height:16px;flex:none}

  main{max-width:960px;margin:-48px auto 0;padding:0 16px 24px;position:relative}

  /* ---------- Schede ---------- */
  .card{background:#fff;border:1px solid var(--bordo);border-radius:var(--raggio);box-shadow:var(--ombra)}
  .selettore{padding:20px}
  .selettore h2{margin:0 0 4px;font-size:1.05rem;font-weight:700}
  .selettore .aiuto{margin:0 0 14px;color:var(--grigio);font-size:.92rem}
  .gruppo{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px dashed var(--bordo)}
  .gruppo:first-of-type{border-top:0}
  .anno{flex:none;width:74px;padding-top:7px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grigio-chiaro)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font:inherit;font-weight:600;font-size:.98rem;min-width:56px;padding:8px 14px;border-radius:10px;cursor:pointer;
    background:var(--blu-50);color:var(--blu-700);border:1px solid var(--blu-100);transition:all .15s ease;
  }
  .chip:hover{background:var(--blu-100);transform:translateY(-1px)}
  .chip[aria-pressed="true"]{background:var(--blu-700);color:#fff;border-color:var(--blu-700);box-shadow:0 4px 12px rgba(31,78,121,.3)}
  .chip:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
  .scheletro{height:38px;border-radius:10px;background:linear-gradient(90deg,#eef2f7 25%,#f7f9fc 50%,#eef2f7 75%);background-size:200% 100%;animation:luccica 1.2s infinite}
  @keyframes luccica{to{background-position:-200% 0}}

  /* ---------- Risultati ---------- */
  #esito{margin-top:20px;scroll-margin-top:12px}
  .testa-esito{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 4px 14px}
  .testa-esito h2{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--blu-900)}
  .coord{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--grigio);font-size:.92rem}
  .coord b{color:var(--testo);font-weight:600}
  .azioni{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--bordo);border-radius:10px;padding:3px}
  .seg button{font:inherit;font-size:.88rem;font-weight:600;border:0;background:transparent;color:var(--grigio);padding:7px 12px;border-radius:8px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--blu-700);color:#fff}
  .btn{font:inherit;font-size:.88rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;
       background:#fff;border:1px solid var(--bordo);color:var(--blu-700);cursor:pointer}
  .btn:hover{background:var(--blu-50)}
  .btn svg{width:16px;height:16px}

  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .docente{padding:16px;display:flex;flex-direction:column;gap:12px;animation:entra .25s ease both}
  @keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .chi{display:flex;gap:12px;align-items:center}
  .avatar{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:#fff;background:var(--blu-500)}
  .nome{font-weight:700;font-size:1.02rem;line-height:1.25}
  .materie{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .materia{font-size:.78rem;color:var(--grigio);background:#f2f4f7;border-radius:6px;padding:2px 8px}
  .posto{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;background:var(--p1-bg);color:var(--p1)}
  .posto svg{flex:none;width:18px;height:18px;margin-top:2px}
  .posto .aula{font-weight:700}
  .posto .dove{font-size:.85rem;opacity:.9}
  .posto.terra{background:var(--terra-bg);color:var(--terra)}
  .posto.p2{background:var(--p2-bg);color:var(--p2)}
  .posto.bib{background:var(--bib-bg);color:var(--bib)}

  /* vista per aula */
  .aula-blocco{padding:0;overflow:hidden;margin-bottom:12px;animation:entra .25s ease both}
  .aula-blocco .posto{border-radius:0;padding:14px 16px}
  .aula-blocco ul{list-style:none;margin:0;padding:6px 16px 10px}
  .aula-blocco li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--bordo)}
  .aula-blocco li:first-child{border-top:0}
  .aula-blocco li span{color:var(--grigio);font-size:.88rem;text-align:right}

  .legenda{display:flex;flex-wrap:wrap;gap:14px;margin:14px 4px 0;font-size:.82rem;color:var(--grigio)}
  .legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  .vuoto{padding:28px;text-align:center;color:var(--grigio)}
  .vuoto svg{width:42px;height:42px;color:var(--blu-500);opacity:.6}
  .avviso{margin-top:18px;padding:14px 16px;display:flex;gap:10px;color:var(--grigio);font-size:.9rem}
  .avviso svg{flex:none;width:18px;height:18px;color:var(--blu-500);margin-top:2px}

  footer{max-width:960px;margin:0 auto;padding:6px 20px 30px;color:var(--grigio-chiaro);font-size:.82rem;text-align:center}

  @media (max-width:600px){
    header{padding:26px 16px 66px}
    .gruppo{flex-direction:column;gap:6px}
    .anno{width:auto;padding-top:0}
    .chips{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
    .chip{min-width:0;padding:9px 4px}
    .testa-esito{align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media print{
    header{background:#fff!important;color:#000;padding:0 0 10px;border-bottom:2px solid #000}
    header::before,header::after,.selettore,.azioni,.legenda,footer{display:none!important}
    .pillola{background:none;border:1px solid #999;color:#000}
    main{margin:12px 0 0;padding:0}
    body{background:#fff}
    .card{box-shadow:none;break-inside:avoid}
    .avatar{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow" id="istituto">IIS "Francesco Ciusa" – Nuoro</span>
    <h1 id="titolo">Colloqui scuola-famiglia</h1>
    <p class="sottotitolo">Seleziona la classe per visualizzare i docenti e le relative collocazioni.</p>
    <div class="pillole" id="pillole"></div>
  </div>
</header>

<main>
  <section class="card selettore" aria-labelledby="sel-titolo">
    <h2 id="sel-titolo" style="margin-bottom:12px">Seleziona la classe</h2>
    <div id="classi">
      <div class="gruppo"><div class="anno">&nbsp;</div><div class="chips" style="flex:1"><div class="scheletro" style="width:100%"></div></div></div>
      <div class="gruppo"><div class="anno">&nbsp;</div><div class="chips" style="flex:1"><div class="scheletro" style="width:80%"></div></div></div>
    </div>
  </section>

  <section id="esito" aria-live="polite"></section>
  <div id="avviso"></div>
</main>

<footer>Dati a cura dell'Istituto</footer>

<script>
  /* Indirizzo dell'app Apps Script (deployment "Chiunque"), con ?formato=json */
  const API = 'https://script.google.com/macros/s/AKfycbxypN97Ehb7XkrbxIL5QRhrx-ikhMxdD4T0N6Fizq5gyhnA7jsavoXv-aHyNOOCRYEUXw/exec?formato=json';
  const CLASSE_INIZIALE = new URLSearchParams(location.search).get('classe') || '';
  let DATI = null;
  const $ = id => document.getElementById(id);
  const ICONE = {
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    ora:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    stampa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    utente:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    cerca:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
  };
  const COLORI_AVATAR = ['#2f6fae','#0f7b5f','#7a3fb0','#b26a00','#c2410c','#0e7490','#9d174d','#4d7c0f'];

  let ultimoEsito = null, vista = 'docente';

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');

  function iniziali(nome){
    const p = String(nome).replace(/\(.*?\)/g,'').trim().split(/\s+/);
    return ((p[0]||'')[0]||'') + ((p[1]||'')[0]||'');
  }
  function coloreDa(nome){
    let h = 0; for (const ch of nome) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    return COLORI_AVATAR[h % COLORI_AVATAR.length];
  }
  /* "aula n. 48 (2^A) – piano 1° biennio a destra" -> {aula, dove, classe css} */
  function analizzaPosto(s){
    const t = String(s || '');
    const parti = t.split(/\s+[–-]\s+/);
    let aula = parti[0] || t, dove = parti.slice(1).join(' – ');
    const m = aula.match(/aula\s*n\.?\s*(\d+)\s*(\(([^)]+)\))?/i);
    if (m) { aula = 'Aula ' + m[1]; if (m[3]) dove = (dove ? dove + ' · ' : '') + 'aula della ' + m[3]; }
    dove = dove.replace(/^piano\s+/i,'Piano ');
    const l = t.toLowerCase();
    const css = l.includes('biblioteca') ? 'bib' : l.includes('terra') ? 'terra' : l.includes('2°') ? 'p2' : 'p1';
    return { aula, dove, css };
  }
  function bloccoPosto(s){
    const p = analizzaPosto(s);
    return '<div class="posto ' + p.css + '">' + ICONE.pin +
           '<div><div class="aula">' + esc(p.aula) + '</div>' + (p.dove ? '<div class="dove">' + esc(p.dove) + '</div>' : '') + '</div></div>';
  }

  function errore(err){
    $('esito').innerHTML = '<div class="card vuoto">' + ICONE.info + '<p>Si è verificato un errore nel caricamento dei dati.<br>Riprova tra qualche istante.</p></div>';
    console.error(err);
  }

  function mostraIntestazione(imp){
    if (imp.titolo) { $('titolo').textContent = imp.titolo; document.title = imp.titolo; }
    if (imp.istituto) $('istituto').textContent = imp.istituto;
    let p = '';
    if (imp.data)   p += '<span class="pillola">' + ICONE.cal + esc(imp.data) + '</span>';
    if (imp.orario) p += '<span class="pillola">' + ICONE.ora + esc(imp.orario) + '</span>';
    $('pillole').innerHTML = p;
    if (imp.avviso) $('avviso').innerHTML = '<div class="card avviso">' + ICONE.info + '<div>' + esc(imp.avviso) + '</div></div>';
  }

  function popolaClassi(classi){
    const perAnno = {};
    classi.forEach(c => (perAnno[c.valore.charAt(0)] = perAnno[c.valore.charAt(0)] || []).push(c));
    $('classi').innerHTML = Object.keys(perAnno).sort().map(a =>
      '<div class="gruppo"><div class="anno">Classi ' + esc(a) + '^</div><div class="chips">' +
      perAnno[a].map(c => '<button type="button" class="chip" aria-pressed="false" data-classe="' + esc(c.valore) + '">' + esc(c.etichetta) + '</button>').join('') +
      '</div></div>').join('');
    $('classi').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => cerca(b.dataset.classe, true)));
  }

  function evidenzia(k){
    document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.classe === k ? 'true' : 'false'));
  }

  function cerca(classe, scorri){
    const k = norm(classe); if (!k) return;
    evidenzia(k);
    $('esito').innerHTML = '<div class="griglia">' + '<div class="card docente"><div class="scheletro"></div><div class="scheletro"></div></div>'.repeat(3) + '</div>';
    const c = (DATI.classi || []).find(x => x.valore === k);
    ultimoEsito = c ? { trovata:true, classe:c.etichetta, coordinatore:c.coordinatore, docenti:c.docenti }
                    : { trovata:false, classe:k.replace(/^(\d)/,'$1^') };
    disegna(); if (scorri) $('esito').scrollIntoView();
    history.replaceState(null, '', '?classe=' + k);
  }

  function disegna(){
    const r = ultimoEsito; if (!r) return;
    if (!r.trovata){
      $('esito').innerHTML = '<div class="card vuoto">' + ICONE.cerca + '<p>Non è ancora disponibile il prospetto per la classe <b>' + esc(r.classe) + '</b>.</p></div>';
      return;
    }
    let corpo;
    if (vista === 'docente'){
      corpo = '<div class="griglia">' + r.docenti.map((d,i) =>
        '<article class="card docente" style="animation-delay:' + (i*30) + 'ms">' +
          '<div class="chi"><div class="avatar" style="background:' + coloreDa(d.docente) + '">' + esc(iniziali(d.docente)) + '</div>' +
          '<div><div class="nome">' + esc(d.docente) + '</div><div class="materie">' +
            d.materie.map(m => '<span class="materia">' + esc(m) + '</span>').join('') + '</div></div></div>' +
          bloccoPosto(d.collocazione) +
        '</article>').join('') + '</div>';
    } else {
      const gruppi = {}, ordine = [];
      r.docenti.forEach(d => { if (!gruppi[d.collocazione]) { gruppi[d.collocazione] = []; ordine.push(d.collocazione); } gruppi[d.collocazione].push(d); });
      ordine.sort((a,b) => { const n = s => (s.match(/aula\s*n\.?\s*(\d+)/i)||[,999])[1]*1; return n(a)-n(b); });
      corpo = ordine.map((pos,i) =>
        '<div class="card aula-blocco" style="animation-delay:' + (i*30) + 'ms">' + bloccoPosto(pos) + '<ul>' +
          gruppi[pos].map(d => '<li><b>' + esc(d.docente) + '</b><span>' + esc(d.materie.join(', ')) + '</span></li>').join('') +
        '</ul></div>').join('');
    }
    $('esito').innerHTML =
      '<div class="testa-esito"><div><h2>Classe ' + esc(r.classe) + '</h2>' +
        (r.coordinatore ? '<div class="coord">' + ICONE.utente.replace('<svg','<svg width="16" height="16"') + 'Coordinamento: <b>' + esc(r.coordinatore) + '</b></div>' : '') +
      '</div><div class="azioni">' +
        '<div class="seg" role="group" aria-label="Modalità di visualizzazione">' +
          '<button type="button" data-vista="docente" aria-pressed="' + (vista==='docente') + '">Per docente</button>' +
          '<button type="button" data-vista="aula" aria-pressed="' + (vista==='aula') + '">Per aula</button>' +
        '</div>' +
        '<button type="button" class="btn" id="btn-stampa">' + ICONE.stampa + 'Stampa</button>' +
      '</div></div>' + corpo +
      '<div class="legenda"><span><i style="background:var(--terra)"></i>Piano terra</span><span><i style="background:var(--p1)"></i>Piano 1° biennio</span>' +
      '<span><i style="background:var(--p2)"></i>Piano 2° biennio</span><span><i style="background:var(--bib)"></i>Biblioteca</span></div>';
    $('esito').querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => { vista = b.dataset.vista; disegna(); }));
    $('btn-stampa').addEventListener('click', () => window.print());
  }

  fetch(API, { credentials: 'omit', cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      DATI = d;
      mostraIntestazione(d.impostazioni || {});
      popolaClassi(d.classi || []);
      if (CLASSE_INIZIALE) cerca(CLASSE_INIZIALE, false);
    })
    .catch(err => {
      $('classi').innerHTML = '';
      errore(err);
    });
</script>
</body>
</html>
